
name: Synergy RCE TikTok LIVE Checker

"on":
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install TikTokLive
        run: python -m pip install TikTokLive

- name: Check TikTok accounts
  env:
    CLOUDFLARE_LIVE_TOKEN: ${{ secrets.CLOUDFLARE_LIVE_TOKEN }}
  run: python check_live.py
